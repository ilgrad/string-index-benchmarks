# lexindex under the C² benchmark's protocol. It depends on the **published** crate, at a version
# pinned in Cargo.lock, so that this harness measures what a user installs rather than whatever
# happens to be checked out next door. Built as the crate ships -- no `target-cpu=native`.
[package]
name = "frontier_lex"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
lexindex = "4.5"

[profile.release]
lto = "thin"
codegen-units = 1
