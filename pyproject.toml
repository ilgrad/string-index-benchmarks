[project]
name = "string-index-benchmarks"
version = "0.1.0"
description = "One protocol, thirteen corpora, every compressed string dictionary anyone will let you build"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ilia Gradina", email = "ilia.gradina@gmail.com" }]
# Nothing here is imported by the harness itself: `sib/corpora.py` and `harness/tables.py` run on
# the standard library alone, so a campaign needs no environment. The chart is the one exception.
dependencies = []

[project.optional-dependencies]
chart = ["matplotlib>=3.8"]

[project.scripts]
sib = "sib.__main__:main"

[project.urls]
Homepage = "https://github.com/ilgrad/string-index-benchmarks"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sib"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
